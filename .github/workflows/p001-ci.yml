name: Project 001 CI

on:
  push:
    branches:
      - 'p001/**'
  pull_request:
    paths:
      - 'projects/project-001-ai-defense-simulator/**'
      - '.github/workflows/p001-ci.yml'

permissions:
  contents: read

concurrency:
  group: p001-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/project-001-ai-defense-simulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/project-001-ai-defense-simulator/requirements.txt

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and audit dependencies
        run: python -m pip install -r requirements.txt pip-audit

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run test suite
        run: python -m pytest -q

      - name: Audit installed dependencies
        run: python -m pip_audit -r requirements.txt
