name: P010 Chess Tests

on:
  push:
    branches:
      - main
    paths:
      - "projects/project-005-intelligent-chess-platform/**"
      - ".github/workflows/p010-tests.yml"
  pull_request:
    paths:
      - "projects/project-005-intelligent-chess-platform/**"
      - ".github/workflows/p010-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-005-intelligent-chess-platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run P010 tests
        run: python -m pytest -q
      - name: Check the evaluation runs
        run: python -m p010.evaluation pilot
