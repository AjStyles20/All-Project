name: P011 Defence Practice Tests

on:
  push:
    branches:
      - main
    paths:
      - "projects/project-001-ai-defense-simulator/**"
      - ".github/workflows/p011-tests.yml"
  pull_request:
    paths:
      - "projects/project-001-ai-defense-simulator/**"
      - ".github/workflows/p011-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-001-ai-defense-simulator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run P011 tests
        run: python -m pytest -q
      - name: Check the evaluation runs
        run: python -m p011.evaluation pilot
