name: P003 ETEC Tests

on:
  push:
    branches: [p003-etec-implementation]
    paths:
      - 'projects/project-011-geopolitical-economic-risk/**'
      - '.github/workflows/p003-etec-tests.yml'
  pull_request:
    paths:
      - 'projects/project-011-geopolitical-economic-risk/**'
      - '.github/workflows/p003-etec-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-011-geopolitical-economic-risk
    env:
      PYTHONPATH: ${{ github.workspace }}/projects/project-011-geopolitical-economic-risk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
