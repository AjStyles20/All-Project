name: P012 Rehearsal Room Tests

on:
  push:
    branches:
      - main
    paths:
      - "projects/project-009-ai-virtual-audience/**"
      - ".github/workflows/p012-tests.yml"
  pull_request:
    paths:
      - "projects/project-009-ai-virtual-audience/**"
      - ".github/workflows/p012-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-009-ai-virtual-audience/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run audience engine tests
        run: node --test
