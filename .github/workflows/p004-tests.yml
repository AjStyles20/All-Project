name: P004 Compression Gateway Tests

on:
  push:
    branches:
      - main
    paths:
      - "projects/project-012-internet-compression-proxy/**"
      - ".github/workflows/p004-tests.yml"
  pull_request:
    paths:
      - "projects/project-012-internet-compression-proxy/**"
      - ".github/workflows/p004-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-012-internet-compression-proxy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run P004 tests (including security invariants S1-S10)
        run: python -m pytest -q
