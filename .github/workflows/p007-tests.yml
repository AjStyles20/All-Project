name: P007 School Points Tests

on:
  push:
    branches:
      - main
    paths:
      - "projects/project-004-school-points-economy/**"
      - ".github/workflows/p007-tests.yml"
  pull_request:
    paths:
      - "projects/project-004-school-points-economy/**"
      - ".github/workflows/p007-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-004-school-points-economy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run P007 tests
        run: python -m pytest -q
      - name: Check the evaluation harness runs
        run: python -m p007.evaluation pilot
