name: P006 Learning World Tests

on:
  push:
    branches:
      - main
    paths:
      - "projects/project-002-ai-virtual-classroom/**"
      - ".github/workflows/p006-tests.yml"
  pull_request:
    paths:
      - "projects/project-002-ai-virtual-classroom/**"
      - ".github/workflows/p006-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-002-ai-virtual-classroom
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run P006 tests
        run: python -m pytest -q
      - name: Check the evaluation runs
        run: PYTHONPATH=src python -m p002.evaluation pilot
