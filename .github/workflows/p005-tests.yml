name: P005 Log Diagnosis Tests

on:
  push:
    branches:
      - main
    paths:
      - "projects/project-014-log-root-cause/**"
      - ".github/workflows/p005-tests.yml"
  pull_request:
    paths:
      - "projects/project-014-log-root-cause/**"
      - ".github/workflows/p005-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-014-log-root-cause
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run P005 tests
        run: python -m pytest -q
